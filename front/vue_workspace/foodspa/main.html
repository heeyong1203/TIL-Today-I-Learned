<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #app{
            width: 1400px;
            height: 800px;
            display: flex;
            flex-direction: column;
        }
        #content_header{
            width: 100%;
            height: 50px;
            background-color: blanchedalmond;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        #content_header input{
            height: 30px;
            align-self: center;
        }
        #content_header input[type='text']{
            width: 400px;
        }
        #content_body{
            width: 100%;
            height: 750px;
            background-color: beige;
            display: flex;
            justify-content: center;
            white-space: pre-wrap;
        }
        table {
            table-layout: fixed;  /* 테이블 칸 너비 고정 */
            width: 100%;          /* 테이블 너비 꽉 채우기 */
        }

        th, td {
            overflow: hidden;           /* 넘치는 내용 숨김 */
            text-overflow: ellipsis;    /* 넘치면 ... 표시 */
            white-space: nowrap;        /* 한 줄로 유지 */
            padding: 8px;
        }

        th:nth-child(1), td:nth-child(1) { width: 150px; } /* 상호명 칸 */
        th:nth-child(2), td:nth-child(2), th:nth-child(4), td:nth-child(4) { width: 100px; } /* 전화번호 칸 */
        th:nth-child(3), td:nth-child(3) { width: 400px; } /* 전화번호 칸 */
    </style>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <div id="app">
        <div id="content_header">
            <input type="text" placeholder="음식점 상호명을 입력하세요." />
            <input type="button" value="검색" />
        </div>
        <div id="content_body">
            <!--{{msg}}-->
            <table border="1">
                <thead>
                    <tr>
                        <th>상호명</th>
                        <th>연락처</th>
                        <!--<th>위도</th>-->
                        <!--<th>경도</th>-->
                        <th>주소</th>
                        <th>대표메뉴</th>
                        <th>소개</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="store in storeList" :key="store._URL">
                        <td>{{ store.CMPNM }}</td>
                        <td>{{ store.TELNO }}</td>
                        <!--<td>{{ store.LO }}</td>-->
                        <!--<td>{{ store.LA }}</td>-->
                        <td>{{ store.ADRES }}</td>
                        <td>{{ store.MNMNU }}</td>
                        <td>{{ store.DC }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        /*
        let member={
            name="Frank"
            age:25
        }
        member.name
        member.age
        
        구조 분해

        const {name, age}=member
        */
        const {createApp, reactive, ref} = Vue;

        //Vue3부터는 setup() 메서드 안에 필요한 변수 및 메서드를 한꺼번에 등록한다.
        //단 등록된 변수 및 메서드를 Vue에게 반환(return)
        createApp({
            setup(){
                let msg = ref("apple"); //바인딩 데이터(디자인과 엮여있는 데이터) 선언(ref)
                const storeList = reactive([]);

                //음식목록 요청 메서드 정의
                const getList=(store_name)=>{

                    store_name = (store_name==undefined) ? "" : store_name;

                    $.ajax({
                        url:`http://localhost:7777/food/stores?store_name=${store_name}`,
                        method:"GET",
                        success:(result, status, xhr)=>{
                            //console.log("서버로부터 받은 음식점 목록은", result.body);
                            storeList.splice(0); //removeAll()
                            result.body.forEach( (store) => {
                                storeList.push(store);
                            });
                        }
                    });
                }

                getList("");

                return {storeList, getList};
            }
        }).mount("#app");

    </script>
</body>
</html>
